# /etc/nginx/sites-available/provador-loja  (ln -s para sites-enabled)
# Vitrine pública: loja.provadorfit.com.br/{loja}/{produto}. Mesmo app web do app.provadorfit.com.br
# (/var/www/provador-app); pelo endereço "loja." o app mostra só a página do produto (mobile/utils/vitrineUrl.ts).
# HTTPS: certbot --nginx -d loja.provadorfit.com.br (o certbot acrescenta o bloco 443 e o redirecionamento).
server {
    listen 80;
    listen [::]:80;
    server_name loja.provadorfit.com.br;
    limit_req zone=prov_web burst=150 nodelay;
    limit_conn prov_conn 60;

    root /var/www/provador-app;
    index index.html;

    location /_expo/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        types { font/ttf ttf; image/png png; }
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    # qualquer caminho (/wa-fitness-1/96) cai no app, que lê a loja e o produto do endereço
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf;
}
