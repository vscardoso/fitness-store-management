# /etc/nginx/sites-available/provador-app  (ln -s para sites-enabled)
# App web (Expo export) servido como site estático. Depois: certbot --nginx -d app.provadorfit.com.br
server {
    listen 80;
    listen [::]:80;
    server_name app.provadorfit.com.br;

    root /var/www/provador-app;
    index index.html;

    # arquivos com hash no nome podem ficar em cache; o index.html nunca
    location /_expo/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # app de página única: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
