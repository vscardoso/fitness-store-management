# /etc/nginx/sites-available/provador-api  (ln -s para sites-enabled)
# Depois: certbot --nginx -d api.provadorfit.com.br   (o certbot acrescenta o bloco 443 e o redirecionamento)
server {
    listen 80;
    listen [::]:80;
    server_name api.provadorfit.com.br;

    client_max_body_size 20m;   # fotos de produto e logo

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
