# /etc/nginx/conf.d/provador-protecao.conf  (contexto http: vale para todos os sites)
# Limites por IP e proteção contra conexão lenta e varredura. Ver deploy/protecao/aplicar.sh.

server_tokens off;                      # não anuncia a versão do nginx

limit_req_zone  $binary_remote_addr zone=prov_geral:10m rate=25r/s;   # API: uso normal do app
limit_req_zone  $binary_remote_addr zone=prov_login:10m rate=6r/m;    # login, cadastro, esqueci a senha
limit_req_zone  $binary_remote_addr zone=prov_ia:10m    rate=12r/m;   # scanner de IA (custa cota)
limit_req_zone  $binary_remote_addr zone=prov_web:10m   rate=40r/s;   # arquivos do app (uma tela carrega dezenas)
limit_conn_zone $binary_remote_addr zone=prov_conn:10m;               # conexões simultâneas por IP
limit_req_status  429;
limit_conn_status 429;

# contra conexão lenta (slowloris) e cabeçalhos/corpo gigantes
client_header_timeout 10s;
client_body_timeout   30s;              # prazo entre leituras do corpo (foto de 20 MB em 4G cabe)
send_timeout          30s;
keepalive_timeout     30s;
reset_timedout_connection on;
client_header_buffer_size   2k;
large_client_header_buffers 4 8k;
