name: Deploy App Web

# Todo push na main que mexe no mobile publica o app web (PWA) em app.provadorfit.com.br.
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        working-directory: ./mobile
        run: npm ci

      - name: Typecheck
        working-directory: ./mobile
        run: npx tsc --noEmit

      - name: Build web + tags PWA
        working-directory: ./mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.provadorfit.com.br/api/v1
          CI: '1'
        run: |
          node node_modules/expo/bin/cli export --platform web
          node scripts/pwa-postbuild.js
          grep -q 'rel="manifest"' dist/index.html
          grep -q 'Content-Security-Policy' dist/index.html
          # trava: bundle com import.meta abre em branco no navegador
          if grep -l 'import\.meta' dist/_expo/static/js/web/*.js; then echo "::error::bundle web contem import.meta, publicacao abortada"; exit 1; fi

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          [ -n "$VPS_HOST" ] || { echo "::error::Secret VPS_HOST vazio ou inexistente"; exit 1; }
          [ -n "$VPS_SSH_KEY" ] || { echo "::error::Secret VPS_SSH_KEY vazio ou inexistente"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "::error::ssh-keyscan nao retornou chave do host"; exit 1; }

      - name: Publicar no VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: scp -i ~/.ssh/deploy_key -r mobile/dist/* root@"$VPS_HOST":/var/www/provador-app/

      - name: Conferir site
        run: |
          curl -fsS https://app.provadorfit.com.br/manifest.json | grep -q Provador
          curl -fsS https://app.provadorfit.com.br/ | grep -q 'rel="manifest"'
