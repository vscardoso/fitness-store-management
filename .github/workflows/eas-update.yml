name: EAS Update (OTA)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:

jobs:
  update:
    name: Publicar update OTA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # A mensagem do commit entra por variável de ambiente, nunca colada no comando:
      # aspas na mensagem quebravam o comando (e permitiriam executar código no CI).
      - name: Publicar EAS Update
        run: |
          MSG="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-200)"
          npx eas-cli update --channel preview --non-interactive --message "$MSG"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
