name: Deploy VPS

# Todo push na main que mexe no backend ou no deploy atualiza o VPS.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'deploy/**', '.github/workflows/deploy-vps.yml']
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Publicar mesmo com gente gravando (sim/nao)'
        required: false
        default: 'nao'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          [ -n "$VPS_HOST" ] || { echo "::error::Secret VPS_HOST vazio ou inexistente (Settings > Secrets and variables > Actions > Repository secrets)"; exit 1; }
          [ -n "$VPS_SSH_KEY" ] || { echo "::error::Secret VPS_SSH_KEY vazio ou inexistente"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "::error::ssh-keyscan nao retornou chave do host $VPS_HOST"; exit 1; }

      - name: Guarda de publicação (espera ninguém estar gravando)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          FORCAR: ${{ github.event.inputs.forcar == 'sim' && '1' || '0' }}
        run: |
          # Reiniciar o backend derruba gravação no meio (entrada, venda, cadastro). Espera até 25 min a API ficar
          # sem escrita; se não liberar, adia (rode o workflow de novo, ou com forcar=sim).
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 root@"$VPS_HOST"             "cd /opt/provador/repo && git fetch -q origin main && git show origin/main:deploy/guarda_publicacao.py > /opt/provador/guarda_publicacao.py && FORCAR=$FORCAR python3 /opt/provador/guarda_publicacao.py --esperar 25"             || { echo "::error::Publicação adiada: há gente gravando. Rode 'Deploy VPS' de novo quando liberar."; exit 1; }

      - name: Deploy no VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 root@"$VPS_HOST" \
            'cd /opt/provador/repo && git fetch origin main && git show origin/main:deploy/deploy_vps.sh > /opt/provador/deploy_vps.sh && chmod +x /opt/provador/deploy_vps.sh && /opt/provador/deploy_vps.sh'

      - name: Conferir API publica
        run: curl -fsS https://api.provadorfit.com.br/health
