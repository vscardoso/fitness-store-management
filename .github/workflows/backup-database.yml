name: Database Backup

on:
  schedule:
    # Todo dia às 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do backup manual'
        required: false
        default: 'Manual trigger'

jobs:
  backup:
    name: pg_dump → Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Instalar postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          pg_dump --version

      - name: Run pg_dump
        env:
          DATABASE_BACKUP_URL: ${{ secrets.DATABASE_BACKUP_URL }}
        run: |
          pg_dump "${{ secrets.DATABASE_BACKUP_URL }}" \
            --verbose \
            --no-password \
            2>&1 | tee pg_dump.log | gzip > backup_$(date +%Y-%m-%d_%H-%M).sql.gz
          echo "Exit code pg_dump: ${PIPESTATUS[0]}"

      - name: Verificar integridade do backup
        run: |
          FILE=$(ls backup_*.sql.gz 2>/dev/null | head -1)

          if [ -z "$FILE" ]; then
            echo "ERRO: Arquivo de backup não foi criado."
            cat pg_dump.log || true
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")
          SIZE_HUMAN=$(du -sh "$FILE" | cut -f1)

          echo "Arquivo : $FILE"
          echo "Tamanho : ${SIZE_HUMAN} (${SIZE} bytes)"

          if [ "$SIZE" -lt 100 ]; then
            echo "ERRO: Arquivo suspeito — menor que 100 bytes. pg_dump falhou?"
            cat pg_dump.log || true
            exit 1
          fi

          if ! gzip --test "$FILE"; then
            echo "ERRO: Arquivo .gz corrompido."
            exit 1
          fi

          echo "Backup OK: ${SIZE_HUMAN}"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
        id: verify

      - name: Upload como GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify.outputs.file }}
          path: ${{ steps.verify.outputs.file }}
          retention-days: 30
          if-no-files-found: error

      - name: Resumo do backup
        run: |
          FILE="${{ steps.verify.outputs.file }}"
          SIZE_HUMAN=$(du -sh "$FILE" | cut -f1)
          echo ""
          echo "=================================="
          echo " Backup concluído com sucesso"
          echo "=================================="
          echo " Arquivo : $FILE"
          echo " Tamanho : $SIZE_HUMAN"
          echo " Retenção: 30 dias"
          echo " Hora    : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=================================="
          echo ""
          echo "Para restaurar: ./scripts/restore.sh $FILE"
